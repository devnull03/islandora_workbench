[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "islandora-workbench"
version = "0.1.dev0"
description = "A command-line tool that allows creation, updating, and deletion of Islandora content."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mark Jordan", email = "mjordan@sfu.ca"}
]
dependencies = [
    "requests>=2.22,<3",
    "requests_cache>=1.1",
    "ruamel.yaml<=0.17.21",
    "ruamel.yaml.clib<=0.2.12",
    "pyparsing<3.2",
    "pytest",
    "progress_bar",
    "openpyxl",
    "unidecode",
    "edtf_validate",
    "typing-extensions>=4.14.0",
    "rich",
]

[project.urls]
Homepage = "https://github.com/mjordan/islandora_workbench"
